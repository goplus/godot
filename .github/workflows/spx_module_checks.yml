name: Check External SPX Module

on:
  workflow_call:
    inputs:
      runtime_version:
        description: Runtime version that must match the selected SPX runtime lock.
        required: true
        type: string
      runtime_abi:
        description: Runtime ABI that must match the selected SPX runtime lock.
        required: true
        type: string
      godot_repository:
        description: Godot repository containing the engine source to test.
        required: true
        type: string
      godot_ref:
        description: Full locked Godot commit SHA to test.
        required: true
        type: string
      spx_repository:
        description: SPX repository containing the current runtime lock and module source.
        required: true
        type: string
      spx_ref:
        description: Full current SPX commit SHA to test.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: spx-module-checks-${{ inputs.godot_ref }}-${{ inputs.spx_ref }}
  cancel-in-progress: true

jobs:
  linux-editor-tests:
    name: Linux editor and SPX module unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CC: gcc
      CXX: g++
      GCOV: gcov
      # Restore signatures and products together, without source, counts, or editor.
      COVERAGE_BUILD_PATHS: |
        .sconsign*.dblite
        **/*.o
        **/*.a
        **/*.gcno
    steps:
      - name: Check out locked Godot source
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.godot_repository }}
          ref: ${{ inputs.godot_ref }}
          submodules: recursive
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc \
            g++ \
            pkg-config \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libx11-dev \
            xorg-dev \
            libasound2-dev \
            libopenal-dev \
            libwayland-bin

      - name: Set up current SPX module and locked native context
        id: spx-build
        uses: ./.github/actions/setup-spx-module/build-context
        with:
          runtime-version: ${{ inputs.runtime_version }}
          runtime-abi: ${{ inputs.runtime_abi }}
          repository: ${{ inputs.spx_repository }}
          ref: ${{ inputs.spx_ref }}
          toolchain-scope: native
          cache-scope: linux-x86_64-module-tests
          cache-enabled: 'false'

      - name: Install coverage tools
        run: python3 -m pip install -r .github/scripts/requirements.txt

      - name: Verify coverage collection
        run: python3 .github/scripts/spx_coverage_test.py

      - name: Identify coverage build cache
        id: coverage-context
        shell: bash
        env:
          CACHE_SCOPE: spx-coverage-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.godot_ref }}-${{ hashFiles('.github/workflows/spx_module_checks.yml', '.github/actions/godot-build/action.yml', '.spx-source/godot_modules/spx/spx_scons_profile.json') }}
        run: |
          set -euo pipefail
          toolchain="$(
            set -e
            {
              printf '%s\n' "${ImageOS:-}" "${ImageVersion:-}" "${GITHUB_WORKSPACE}"
              "${CC}" --version
              "${CXX}" --version
              "${GCOV}" --version
              python3 --version
              scons --version
            } | sha256sum | cut -d ' ' -f 1
          )"
          module="$(git -C .spx-source rev-parse --verify HEAD:godot_modules/spx)"
          printf '%s\n' "prefix=${CACHE_SCOPE}-${toolchain}" "module=${module}" >> "${GITHUB_OUTPUT}"

      - name: Restore coverage build
        id: coverage-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.COVERAGE_BUILD_PATHS }}
          key: ${{ steps.coverage-context.outputs.prefix }}-${{ steps.coverage-context.outputs.module }}
          restore-keys: |
            ${{ steps.coverage-context.outputs.prefix }}-

      - name: Prepare restored coverage build
        env:
          CACHE_HIT: ${{ steps.coverage-cache.outputs.cache-hit }}
        run: |
          python3 .github/scripts/spx_coverage.py reset
          if [ "${CACHE_HIT}" != true ]; then
            # Preserve engine objects, but rebuild the changed module and tests.
            python3 .github/scripts/spx_coverage.py clean
          fi

      - name: Build Linux editor with unit tests
        uses: ./.github/actions/godot-build
        with:
          # Recheck capabilities: cached probe objects lack Configure's other files.
          sconsflags: >-
            ${{ steps.spx-build.outputs.editor-release-flags }}
            dev_build=yes debug_symbols=no use_coverage=yes optimize=none fast_unsafe=no
            --config=force
            CC=${{ env.CC }} CXX=${{ env.CXX }}
          custom-modules: ${{ steps.spx-build.outputs.module-path }}
          platform: linuxbsd
          target: editor
          tests: 'yes'
          # SCons caches objects but does not track their .gcno sidecar files.
          scons-cache: ''

      - name: Save coverage build
        if: steps.coverage-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.COVERAGE_BUILD_PATHS }}
          key: ${{ steps.coverage-cache.outputs.cache-primary-key }}

      - name: Run SPX module unit tests
        shell: bash
        run: |
          set -euo pipefail
          godot_bin=./bin/godot.linuxbsd.editor.dev.x86_64
          test_list="${RUNNER_TEMP}/godot-test-cases.txt"

          test -x "${godot_bin}"
          "${godot_bin}" --version
          "${godot_bin}" --headless --test --test-case='*SPX*' --list-test-cases | tee "${test_list}"
          if ! grep -F '[SPX]' "${test_list}" >/dev/null; then
            echo "[error] The tests=yes build did not register SPX module unit tests" >&2
            exit 1
          fi
          python3 .github/scripts/spx_coverage.py reset
          "${godot_bin}" --headless --test --test-case='*SPX*' --force-colors

      - name: Collect SPX module coverage
        run: python3 .github/scripts/spx_coverage.py report

      - name: Upload SPX module coverage
        uses: actions/upload-artifact@v5
        with:
          name: coverage-spx-cpp
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  web-normal-smoke:
    name: Web normal compile smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out locked Godot source
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.godot_repository }}
          ref: ${{ inputs.godot_ref }}
          submodules: recursive
          persist-credentials: false

      - name: Set up current SPX module and locked Web context
        id: spx-build
        uses: ./.github/actions/setup-spx-module/build-context
        with:
          runtime-version: ${{ inputs.runtime_version }}
          runtime-abi: ${{ inputs.runtime_abi }}
          repository: ${{ inputs.spx_repository }}
          ref: ${{ inputs.spx_ref }}
          toolchain-scope: web
          cache-scope: web-normal-smoke

      - name: Set up locked Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ steps.spx-build.outputs.emsdk-version }}
          actions-cache-folder: emsdk-cache
          cache-key: spx-module-checks-emsdk-${{ steps.spx-build.outputs.emsdk-version }}-${{ runner.os }}

      - name: Verify locked Emscripten
        run: emcc --version

      - name: Compile Web normal template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            ${{ steps.spx-build.outputs.template-release-flags }}
            threads=no
          custom-modules: ${{ steps.spx-build.outputs.module-path }}
          platform: web
          target: template_release

      - name: Verify Web normal archive
        run: python3 -m zipfile --test bin/godot.web.template_release.wasm32.nothreads.zip
